services:
  web:
    build: .
    image: flight-checklist:latest
    ports:
      # 宿主端口可配置：WEB_PORT=9090 docker compose up -d
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  verify:
    image: flight-checklist:latest
    build: .
    command: ["node", "verify/verify.js"]
    environment:
      WEB_HOST: web
      WEB_PORT: "80"
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
