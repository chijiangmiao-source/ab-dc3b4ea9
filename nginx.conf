server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 健康响应：容器与 Compose 健康检查、verify 冒烟共用
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"flight-checklist-web"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
